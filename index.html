<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lobola Celebration – Save the Date</title>

<style>
body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: linear-gradient(to bottom, #f6f1e7, #e8d8b5);
    text-align: center;
    color: #3b2e1e;
}

.container {
    padding: 40px 20px;
    max-width: 600px;
    margin: auto;
}

h1 {
    font-size: 36px;
    letter-spacing: 2px;
}

h2 {
    font-weight: normal;
    font-style: italic;
}

.date-box {
    margin: 30px 0;
    font-size: 20px;
}

.highlight {
    font-size: 42px;
    font-weight: bold;
}

.location {
    margin-top: 20px;
    font-size: 18px;
}

.dress {
    margin-top: 30px;
    font-size: 20px;
}

.button {
    margin-top: 20px;
}

button {
    background-color: #b89c4d;
    color: white;
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

button:hover {
    background-color: #9c833f;
}

/* Slideshow */
.slideshow {
    margin-top: 30px;
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 300px;
    margin-left: auto;
    margin-right: auto;
    overflow: hidden;
}

.slideshow img {
    width: 100%;
    height: 100%;
    border-radius: 15px;
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.slideshow img.active {
    opacity: 1;
}

/* Map container */
.map-container {
    margin-top: 30px;
}

.map-container iframe {
    width: 100%;
    height: 300px;
    border: 0;
    border-radius: 15px;
}
</style>
</head>

<body>

<audio id="bg-music" loop>
  <source src="lobola.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h2>Save the Date</h2>
<h1>LOBOLA CELEBRATION</h1>

<div class="date-box">
APRIL <br>
<span class="highlight">03</span><br>
2026 <br><br>
12:00 PM
</div>

<div class="slideshow">
    <img src="rings.jpeg" class="active">
    <img src="cow.jpeg">
    <img src="part.jpeg">
    <img src="second.jpeg">
    <img src="verse.jpeg">
    <img src="love.jpeg">
</div>

<div class="location">
📍 <span id="dynamic-location">Ka Xigalo Tsutsumani, ka Maluleke</span>
</div>



<div class="dress">
Bride: <strong>XILUVA MALULEKE</strong><br>
Groom: <strong>HASANI LICKTON MALULEKE</strong><br>
Dress Code: <strong>Champagne & White</strong>
</div>

<div class="button">
<a href="https://docs.google.com/forms/d/e/1FAIpQLSdIPopk24yMU4-Ox61ZEei0mHvZsQtl51zohtkgApLwTnPbAQ/viewform?usp=dialog" target="_blank">
<button>Confirm Attendance</button>
</a>
</div>

</div>

<!-- Embedded Google Map -->
<div class="map-container">
    <iframe 
        src="https://www.google.com/maps?q=Ka%20Xigalo%20Tsutsumani,%20ka%20Maluleke&output=embed"
        loading="lazy"
        allowfullscreen>
    </iframe>
</div>

<!-- Open in Google Maps Button -->
<div class="button">
<a href="https://maps.app.goo.gl/fMHjgofKr5ovQR858" target="_blank">
<button>Open in Google Maps</button>
</a>
</div>

<script>
let slides = document.querySelectorAll('.slideshow img');
let slideIndex = 0;

function showSlides() {
    slides.forEach(slide => slide.classList.remove('active'));
    slides[slideIndex].classList.add('active');
    slideIndex = (slideIndex + 1) % slides.length;
    setTimeout(showSlides, 3000);
}

const locations = [
    "Ka Xigalo Tsutsumani, ka Maluleke",
    "Part 2: WELCOMING OF BRIDE: Ka Xigalo Mahlambandlopfu, Ka Maluleke - Madhevu (Same Day)"
];

let locIndex = 0;

function rotateLocation() {
    locIndex = (locIndex + 1) % locations.length;
    document.getElementById('dynamic-location').textContent = locations[locIndex];
    setTimeout(rotateLocation, 5000);
}

showSlides();
rotateLocation();

document.addEventListener("DOMContentLoaded", function() {
    const music = document.getElementById("bg-music");

    function startMusic() {
        music.play().catch(() => {});
        document.body.removeEventListener("touchstart", startMusic);
        document.body.removeEventListener("click", startMusic);
    }

    document.body.addEventListener("touchstart", startMusic, { once: true });
    document.body.addEventListener("click", startMusic, { once: true });
});
</script>

</body>
</html>
